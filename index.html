<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myna - 会議・研修 高精度文字起こし</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans JP & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- docx.js for generating real Word (.docx) files in browser -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        myna: {
                            black: '#0F172A',
                            dark: '#1E293B',
                            amber: '#F59E0B',
                            amberHover: '#D97706',
                            light: '#F8FAFC',
                            surface: '#FFFFFF',
                            accent: '#FEF3C7'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* ==========================================
           テーマ変数（デフォルト：九官鳥ダークモード）
           ========================================== */
        :root {
            --bg-gradient: radial-gradient(circle at 15% 10%, #1E1B4B 0%, #0F172A 45%, #090D16 100%);
            --card-bg: rgba(30, 41, 59, 0.72);
            --card-border: rgba(148, 163, 184, 0.16);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --input-bg: rgba(15, 23, 42, 0.75);
            --input-border: rgba(148, 163, 184, 0.25);
            --subpanel-bg: rgba(15, 23, 42, 0.55);
            --studio-bg: radial-gradient(circle at center, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            --divider-color: rgba(148, 163, 184, 0.15);
            --visualizer-bg: rgba(9, 13, 22, 0.7);
            --visualizer-idle: #334155;
        }

        /* ピュアホワイト・ライトモード（黄ばみゼロの純白＆クールスレート） */
        body.theme-light {
            --bg-gradient: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 50%, #E2E8F0 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(203, 213, 225, 0.85);
            --card-shadow: 0 12px 30px -10px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.05);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --input-bg: #F8FAFC;
            --input-border: #CBD5E1;
            --subpanel-bg: #F8FAFC;
            --studio-bg: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
            --divider-color: #E2E8F0;
            --visualizer-bg: #FFFFFF;
            --visualizer-idle: #CBD5E1;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ヘッダーの九官鳥の羽の艶めきグラデーション */
        .myna-header-bg {
            background: linear-gradient(135deg, #090D16 0%, #0F172A 55%, #1E1B4B 100%);
        }

        /* テーマ適応ユーティリティ */
        .myna-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(16px);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .theme-text-primary { color: var(--text-primary); }
        .theme-text-secondary { color: var(--text-secondary); }
        .theme-text-muted { color: var(--text-muted); }
        .theme-divider { border-color: var(--divider-color); }
        .theme-subpanel {
            background: var(--subpanel-bg);
            border: 1px solid var(--card-border);
        }
        .theme-studio-panel {
            background: var(--studio-bg);
            border: 1px solid var(--card-border);
        }
        .theme-input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-primary);
        }
        .theme-input::placeholder {
            color: var(--text-muted);
        }
        .theme-visualizer {
            background: var(--visualizer-bg);
            border: 1px solid var(--card-border);
        }

        /* 録音ボタンの華やかな光沢とアニメーション */
        .btn-record-ready {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 55%, #D97706 100%);
            color: #0F172A;
            box-shadow: 0 10px 28px -5px rgba(245, 158, 11, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        .btn-record-ready:hover {
            background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 55%, #B45309 100%);
            box-shadow: 0 14px 34px -5px rgba(245, 158, 11, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.97); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.75); }
            70% { transform: scale(1.01); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.97); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: #FFFFFF;
            animation: pulse-ring 2s infinite;
        }
        /* ゴールドアクセントのプライマリボタン */
        .btn-gold-gradient {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 50%, #D97706 100%);
            box-shadow: 0 8px 20px -4px rgba(245, 158, 11, 0.45);
        }
        .btn-gold-gradient:hover:not(:disabled) {
            background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 50%, #B45309 100%);
            box-shadow: 0 12px 24px -4px rgba(245, 158, 11, 0.65);
            transform: translateY(-1px);
        }
        /* Wordボタンのロイヤルブルーグラデーション */
        .btn-word-gradient {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 60%, #1D4ED8 100%);
            box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.45);
        }
        .btn-word-gradient:hover:not(:disabled) {
            background: linear-gradient(135deg, #60A5FA 0%, #2563EB 60%, #1E40AF 100%);
            box-shadow: 0 10px 20px -4px rgba(37, 99, 235, 0.6);
            transform: translateY(-1px);
        }
        /* Markdownボタンのインディゴ・スレートグラデーション */
        .btn-md-gradient {
            background: linear-gradient(135deg, #475569 0%, #334155 60%, #1E293B 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 16px -4px rgba(15, 23, 42, 0.45);
        }
        .btn-md-gradient:hover:not(:disabled) {
            background: linear-gradient(135deg, #64748B 0%, #334155 60%, #0F172A 100%);
            box-shadow: 0 10px 20px -4px rgba(15, 23, 42, 0.6);
            transform: translateY(-1px);
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
            <!-- 右側アクションボタン群（履歴 ＋ テーマ切替 ＋ APIキー設定） -->
            <div class="flex items-center space-x-2 shrink-0">
                <!-- 過去の履歴ボタン -->
                <button id="btn-open-history-modal" type="button" title="過去の文字起こし履歴"
                    class="flex items-center space-x-1.5 px-3 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 border border-white/15 text-xs font-medium text-slate-200 transition cursor-pointer">
                    <i data-lucide="history" class="w-4 h-4 text-amber-300"></i>
                    <span class="hidden sm:inline">履歴</span>
                    <span id="history-count-badge" class="hidden px-1.5 py-0.2 bg-amber-400 text-slate-950 rounded-full text-[10px] font-bold">0</span>
                </button>

                <!-- ダーク / ライト モード切替ボタン -->
                <button id="btn-toggle-theme" type="button" title="ダーク / ライトモード切替"
                    class="flex items-center space-x-1.5 px-3 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 border border-white/15 text-xs font-medium text-slate-200 transition cursor-pointer">
                    <i id="theme-icon" data-lucide="sun" class="w-4 h-4 text-amber-300"></i>
                    <span id="theme-label" class="hidden sm:inline">ライト表示</span>
                </button>

                <!-- APIキー設定ボタン -->
                <button id="btn-open-api-modal" type="button"
                    class="flex items-center space-x-2 px-3.5 sm:px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 border border-white/15 text-xs sm:text-sm font-medium transition cursor-pointer shadow-sm">
                    <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                    <i data-lucide="key" class="w-4 h-4 text-myna-amber"></i>
                    <span id="api-status-label">APIキー設定</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 過去の文字起こし履歴 モーダル -->
    <div id="history-modal" class="hidden fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full p-6 space-y-4 my-auto text-slate-900">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-amber-100 text-myna-amber flex items-center justify-center">
                        <i data-lucide="history" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base text-slate-900">過去の文字起こし履歴</h3>
                        <p class="text-[11px] text-slate-500">このブラウザに自動保存された過去の記録（最新20件）を呼び出せます</p>
                    </div>
                </div>
                <button id="btn-close-history-modal" type="button" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- 履歴リスト表示エリア -->
            <div id="history-list-container" class="max-h-96 overflow-y-auto space-y-2.5 pr-1">
                <!-- JSで動的に履歴カードを生成 -->
            </div>

            <div class="flex items-center justify-between pt-3 border-t border-slate-200">
                <button id="btn-clear-all-history" type="button"
                    class="text-xs text-red-600 hover:bg-red-50 px-3 py-2 rounded-lg transition cursor-pointer">
                    履歴をすべて削除
                </button>
                <button id="btn-cancel-history-modal" type="button"
                    class="px-5 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition cursor-pointer">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- APIキー設定＆取得ガイド モーダル -->
    <div id="api-modal" class="hidden fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 space-y-5 my-auto text-slate-900">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-amber-100 text-myna-amber flex items-center justify-center">
                        <i data-lucide="key-round" class="w-4 h-4"></i>
                    </div>
                    <h3 class="font-bold text-base text-slate-900">Gemini APIキーの設定</h3>
                </div>
                <button id="btn-close-api-modal" type="button" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- APIキー入力フォーム -->
            <div class="space-y-2">
                <label for="api-key-input" class="block text-xs font-bold text-slate-700">
                    あなたの Gemini APIキー
                </label>
                <div class="flex space-x-2">
                    <input type="password" id="api-key-input" placeholder="AIzaSy..."
                        class="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono text-slate-900 focus:outline-none focus:ring-2 focus:ring-myna-amber focus:bg-white">
                    <button id="btn-toggle-key-visibility" type="button" title="表示/非表示"
                        class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
                <p class="text-[11px] text-slate-500">
                    ※入力したキーはお使いの端末のブラウザ内にのみ保存され、外部サーバーへ送信されることはありません。
                </p>
            </div>

            <!-- 初めての先生向け：取得手順ガイド -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                <div class="flex items-center space-x-1.5 text-slate-900 font-bold text-xs">
                    <i data-lucide="help-circle" class="w-4 h-4 text-myna-amber"></i>
                    <span>初めての方へ：APIキーの無料取得方法（約1分）</span>
                </div>
                <ol class="text-xs text-slate-700 space-y-2 list-decimal list-inside leading-relaxed">
                    <li>
                        下のボタンから <strong>Google AI Studio</strong> を開き、個人のGoogleアカウントでログインします。
                        <div class="mt-1.5 ml-4">
                            <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer"
                                class="inline-flex items-center space-x-1.5 px-3 py-1.5 bg-white hover:bg-slate-50 text-blue-600 border border-blue-200 rounded-lg font-bold text-xs shadow-2xs transition">
                                <span>Google AI Studio を開く</span>
                                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            </a>
                        </div>
                    </li>
                    <li>画面の <strong>「APIキーを作成（Create API key）」</strong> ボタンをクリックします。</li>
                    <li>表示された英数字の文字列（<code class="bg-white px-1 py-0.5 rounded border border-slate-200">AIza...</code>）をコピーし、上の入力欄に貼り付けて「保存する」を押してください。</li>
                </ol>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-200">
                <button id="btn-delete-api-key" type="button"
                    class="text-xs text-red-600 hover:bg-red-50 px-3 py-2 rounded-lg transition">
                    保存済みのキーを削除
                </button>
                <div class="flex space-x-2">
                    <button id="btn-cancel-api-modal" type="button"
                        class="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                        閉じる
                    </button>
                    <button id="btn-save-api-key" type="button"
                        class="px-5 py-2 text-xs font-bold bg-myna-amber hover:bg-myna-amberHover text-slate-900 rounded-xl shadow-sm transition cursor-pointer">
                        保存する
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-7 space-y-7">

        <!-- 通知・メッセージエリア（alertの代わり） -->
        <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

        <!-- 1. 会議情報入力カード -->
        <section class="myna-card rounded-3xl p-6">
            <div class="flex items-center space-x-3 mb-4">
                <span class="w-7 h-7 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-slate-950 font-bold text-xs flex items-center justify-center shadow-sm">1</span>
                <h2 class="font-bold text-base theme-text-primary">会議・研修の基本情報（任意）</h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label for="meeting-title" class="block text-xs font-bold theme-text-secondary mb-1.5">
                        会議・研修名 <span class="theme-text-muted font-normal">（※未入力時は「日付_会議記録」になります）</span>
                    </label>
                    <input type="text" id="meeting-title" placeholder="例：第4回 職員会議、校内ICT研修"
                        class="theme-input w-full px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-myna-amber focus:border-myna-amber transition">
                </div>
                <div>
                    <label for="meeting-date" class="block text-xs font-bold theme-text-secondary mb-1.5">実施日</label>
                    <input type="date" id="meeting-date"
                        class="theme-input w-full px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-myna-amber focus:border-myna-amber transition">
                </div>
            </div>
        </section>

        <!-- 2. 音声入力カード（録音メイン ＋ 下部にコンパクトなファイル選択） -->
        <section class="myna-card rounded-3xl p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <span class="w-7 h-7 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-slate-950 font-bold text-xs flex items-center justify-center shadow-sm">2</span>
                    <h2 class="font-bold text-base theme-text-primary">音声の録音</h2>
                </div>
                <span id="audio-status-badge" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-500/15 theme-text-secondary border border-slate-500/20">
                    待機中
                </span>
            </div>

            <!-- メイン：ワンタッチ録音エリア（スタジオ風パネル） -->
            <div class="theme-studio-panel rounded-2xl p-6 sm:p-9 flex flex-col items-center justify-center text-center relative overflow-hidden">
                <!-- 九官鳥の羽の艶めきを表現した控えめなオーロラ光彩 -->
                <div class="absolute -top-24 -right-24 w-56 h-56 bg-indigo-500/15 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-24 -left-24 w-56 h-56 bg-sky-500/15 rounded-full blur-3xl pointer-events-none"></div>

                <div id="recording-timer" class="text-4xl sm:text-5xl font-mono font-bold theme-text-primary mb-2 tracking-wider relative z-10">
                    00:00:00
                </div>
                <p id="recording-hint" class="text-xs sm:text-sm theme-text-secondary mb-5 relative z-10">ボタンを押すとすぐに録音が始まります</p>

                <!-- 簡易音量ビジュアライザー -->
                <canvas id="visualizer" class="theme-visualizer w-full max-w-md h-14 mb-6 rounded-xl relative z-10"></canvas>

                <button id="btn-record-toggle" type="button"
                    class="btn-record-ready flex items-center space-x-3 px-9 py-4 rounded-full font-bold text-base transition-all active:scale-95 cursor-pointer relative z-10">
                    <span id="record-dot" class="w-3.5 h-3.5 rounded-full bg-red-600 shadow-sm"></span>
                    <span id="btn-record-text">録音を開始</span>
                </button>
            </div>

            <!-- サブ：録音ボタンの下に配置したコンパクトなファイル読み込みボタン -->
            <div id="drop-zone" class="theme-subpanel mt-4 flex flex-col sm:flex-row items-center justify-center gap-2.5 py-3 px-4 rounded-2xl border border-dashed hover:border-myna-amber transition">
                <input type="file" id="audio-file-input" accept="audio/*,video/mp4,video/webm" class="hidden">
                <span class="text-xs theme-text-secondary font-medium">録音済みの音声データがある場合：</span>
                <button type="button" id="btn-select-file"
                    class="theme-input inline-flex items-center space-x-1.5 px-4 py-1.5 hover:border-myna-amber rounded-xl text-xs font-bold shadow-2xs transition cursor-pointer">
                    <i data-lucide="folder-open" class="w-3.5 h-3.5 text-myna-amber"></i>
                    <span>クリックして音声ファイルを選択</span>
                </button>
            </div>

            <!-- 音声準備完了後のプレビュー＆文字起こし実行バー -->
            <div id="audio-ready-panel" class="hidden mt-5 pt-5 border-t theme-divider">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl">
                    <div class="flex items-center space-x-3 w-full sm:w-auto">
                        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-slate-950 flex items-center justify-center shrink-0 shadow-sm">
                            <i data-lucide="file-audio" class="w-5 h-5"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <p id="loaded-audio-name" class="text-sm font-bold theme-text-primary truncate">録音データ.webm</p>
                            <p id="loaded-audio-meta" class="text-xs theme-text-secondary">長さ: --:-- / 15分ごとに自動分割して処理します</p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                        <button id="btn-clear-audio" type="button"
                            class="px-3.5 py-2.5 text-xs font-bold theme-text-secondary hover:text-red-400 hover:bg-red-500/10 rounded-xl transition cursor-pointer">
                            破棄
                        </button>
                        <button id="btn-start-transcribe" type="button"
                            class="btn-gold-gradient flex-1 sm:flex-initial flex items-center justify-center space-x-2 px-6 py-3 text-slate-950 font-bold rounded-xl transition-all active:scale-95 cursor-pointer">
                            <i data-lucide="sparkles" class="w-4 h-4"></i>
                            <span>文字起こしを実行する</span>
                        </button>
                    </div>
                </div>
                <!-- 音声確認用プレイヤー -->
                <audio id="audio-preview-player" controls class="w-full mt-3 h-10 rounded-xl"></audio>
            </div>
        </section>

        <!-- 3. 文字起こし進行状況 ＆ 結果表示カード（常時表示） -->
        <section id="result-section" class="myna-card rounded-3xl p-6 space-y-5">
            <!-- ヘッダーとダウンロードボタン -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b theme-divider pb-4">
                <div class="flex items-center space-x-3">
                    <span class="w-7 h-7 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-slate-950 font-bold text-xs flex items-center justify-center shadow-sm">3</span>
                    <h2 class="font-bold text-base theme-text-primary">文字起こしの進行状況と結果</h2>
                </div>

                <!-- ダウンロードボタン（Word / Markdown 独立配置・完了前は半透明で無効化） -->
                <div class="flex flex-wrap items-center gap-2.5">
                    <button id="btn-download-word" type="button" disabled
                        class="btn-word-gradient flex items-center space-x-2 px-4 py-2.5 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-bold rounded-xl transition-all active:scale-95 cursor-pointer">
                        <i data-lucide="file-text" class="w-4 h-4"></i>
                        <span>Word (.docx) で保存</span>
                    </button>
                    <button id="btn-download-md" type="button" disabled
                        class="btn-md-gradient flex items-center space-x-2 px-4 py-2.5 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-bold rounded-xl transition-all active:scale-95 cursor-pointer">
                        <i data-lucide="file-code" class="w-4 h-4 text-myna-amber"></i>
                        <span>Markdown (.md) で保存</span>
                    </button>
                </div>
            </div>

            <!-- 常時表示の進行状況ステータスバー -->
            <div id="progress-box" class="theme-subpanel rounded-2xl p-4 transition-colors">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center space-x-2">
                        <span id="progress-status-icon" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                        <h3 id="progress-title" class="font-bold text-sm theme-text-primary">進行状況：待機中（音声を録音または選択してください）</h3>
                    </div>
                    <span id="progress-percent" class="theme-input text-xs font-mono font-bold px-2.5 py-0.5 rounded-lg">0%</span>
                </div>
                <div class="w-full bg-slate-500/20 rounded-full h-3 overflow-hidden p-0.5">
                    <div id="progress-bar" class="bg-gradient-to-r from-amber-400 to-orange-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p id="progress-detail" class="text-xs theme-text-secondary mt-2">
                    15分ごとに自動分割し、要約なし・フィラー除去・話者分類で丁寧に文字起こしを行います。
                </p>
            </div>

            <!-- 話者名の一括置換パネル（文字起こし完了後に表示） -->
            <div id="speaker-replace-panel" class="hidden theme-subpanel rounded-2xl p-4 border border-amber-500/30">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center space-x-1.5">
                        <i data-lucide="users" class="w-4 h-4 text-myna-amber"></i>
                        <h3 class="text-xs font-bold theme-text-primary">話者名の一括置換</h3>
                    </div>
                    <span class="text-[11px] theme-text-secondary">検出された話者名を実際の先生のお名前などに一括変換できます</span>
                </div>
                <div id="speaker-replace-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 mt-2">
                    <!-- JSで動的に話者置換フォームを生成 -->
                </div>
            </div>

            <!-- 文字起こしテキスト表示枠（常時表示） -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold theme-text-secondary flex items-center space-x-1.5">
                        <i data-lucide="align-left" class="w-3.5 h-3.5 text-myna-amber"></i>
                        <span>文字起こしテキスト</span>
                    </span>
                    <button id="btn-copy-text" type="button" disabled
                        class="theme-input text-xs flex items-center space-x-1 disabled:opacity-40 disabled:cursor-not-allowed hover:border-myna-amber px-3 py-1.5 rounded-xl font-medium transition cursor-pointer">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        <span>全文コピー</span>
                    </button>
                </div>
                <div id="transcript-output"
                    class="theme-input w-full h-96 overflow-y-auto p-5 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap font-sans select-all"><span class="theme-text-muted">ここに文字起こしされた文章が表示されます...</span></div>
            </div>
        </section>

        <!-- 4. AI要約・議事録ファイル作成カード（プレビュー枠なし・直接作成＆保存） -->
        <section id="minutes-section" class="myna-card rounded-3xl p-6 space-y-4">
            <div class="flex items-center justify-between border-b theme-divider pb-3.5">
                <div class="flex items-center space-x-3">
                    <span class="w-7 h-7 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 text-slate-950 font-bold text-xs flex items-center justify-center shadow-sm">4</span>
                    <h2 class="font-bold text-base theme-text-primary">AI要約・議事録ファイルの作成</h2>
                </div>
                <span id="minutes-status-badge" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-500/15 theme-text-secondary border border-slate-500/20">
                    文字起こし完了後に利用可能
                </span>
            </div>

            <p class="text-xs sm:text-sm theme-text-secondary leading-relaxed">
                上の文字起こし結果をもとに、会議や研修の内容を分かりやすく整理した<strong class="theme-text-primary">「要約・記録ファイル」</strong>を直接作成して保存します。
                <span class="block text-[11px] theme-text-muted mt-1">※決定事項がない研修・講演などの録音でも、内容に合わせて最適な見出し構成で自動整理します。先に「話者名の一括置換」をしておくと、お名前も反映されます。</span>
            </p>

            <!-- 直接作成＆ダウンロードボタン（Word / Markdown 独立配置） -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-1">
                <button id="btn-create-minutes-word" type="button" disabled
                    class="btn-word-gradient flex items-center justify-center space-x-2 px-5 py-3.5 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-bold rounded-xl transition-all active:scale-95 cursor-pointer">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    <span id="label-minutes-word">要約・議事録を Word (.docx) で作成・保存</span>
                </button>
                <button id="btn-create-minutes-md" type="button" disabled
                    class="btn-md-gradient flex items-center justify-center space-x-2 px-5 py-3.5 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-bold rounded-xl transition-all active:scale-95 cursor-pointer">
                    <i data-lucide="file-code" class="w-4 h-4 text-myna-amber"></i>
                    <span id="label-minutes-md">要約・議事録を Markdown (.md) で作成・保存</span>
                </button>
            </div>
        </section>

    </main>

    <!-- フッター -->
    <footer class="border-t theme-divider py-5 mt-8">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs theme-text-muted font-medium">
            Myna - 先生方の校務効率化のための音声文字起こしツール
        </div>
    </footer>

    <script>
        // アイコン初期化
        lucide.createIcons();

        // ==========================================
        // 状態管理変数（初期化前に参照されないよう先頭に配置）
        // ==========================================
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingStartTime = null;
        let timerInterval = null;
        let audioContext = null;
        let analyser = null;
        let animationFrameId = null;
        let wakeLockSentinel = null; // 録音中の画面スリープ防止用

        let currentAudioBlob = null;
        let currentAudioName = "";
        let finalTranscriptText = "";
        let isTranscribing = false;
        let cachedMinutesText = "";
        let cachedMinutesSource = "";
        let isGeneratingMinutes = false;
        let currentHistoryId = null; // 現在表示中の履歴ID

        // ==========================================
        // 0. テーマ切替（九官鳥ダーク / ピュアホワイト・ライト）
        // ==========================================
        const THEME_STORAGE_KEY = 'myna_ui_theme';
        const btnToggleTheme = document.getElementById('btn-toggle-theme');
        const themeIcon = document.getElementById('theme-icon');
        const themeLabel = document.getElementById('theme-label');

        function applyTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('theme-light');
                themeIcon.setAttribute('data-lucide', 'moon');
                themeLabel.textContent = 'ダーク表示';
            } else {
                document.body.classList.remove('theme-light');
                themeIcon.setAttribute('data-lucide', 'sun');
                themeLabel.textContent = 'ライト表示';
            }
            lucide.createIcons();
            if (!isRecording) drawIdleVisualizer();
        }

        // 初期テーマの適用（デフォルトはダークモード）
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';
        applyTheme(savedTheme);

        btnToggleTheme.addEventListener('click', () => {
            const nextTheme = document.body.classList.contains('theme-light') ? 'dark' : 'light';
            localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
            applyTheme(nextTheme);
        });

        // ==========================================
        // 1. APIキー管理（localStorage保存＆モーダル制御）
        // ==========================================
        const API_KEY_STORAGE_KEY = 'myna_gemini_api_key';
        const apiModal = document.getElementById('api-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const apiStatusDot = document.getElementById('api-status-dot');
        const apiStatusLabel = document.getElementById('api-status-label');

        function getSavedApiKey() {
            return (localStorage.getItem(API_KEY_STORAGE_KEY) || "").trim();
        }

        function updateApiStatusBadge() {
            const savedKey = getSavedApiKey();
            if (savedKey) {
                apiStatusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
                apiStatusLabel.textContent = "APIキー設定済";
            } else {
                apiStatusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400";
                apiStatusLabel.textContent = "APIキー設定";
            }
        }

        // 初期状態反映
        updateApiStatusBadge();

        document.getElementById('btn-open-api-modal').addEventListener('click', () => {
            apiKeyInput.value = getSavedApiKey();
            apiKeyInput.type = 'password';
            apiModal.classList.remove('hidden');
        });

        function closeApiModal() {
            apiModal.classList.add('hidden');
        }

        document.getElementById('btn-close-api-modal').addEventListener('click', closeApiModal);
        document.getElementById('btn-cancel-api-modal').addEventListener('click', closeApiModal);

        // モーダル背景クリックで閉じる
        apiModal.addEventListener('click', (e) => {
            if (e.target === apiModal) closeApiModal();
        });

        // パスワード表示/非表示切替
        document.getElementById('btn-toggle-key-visibility').addEventListener('click', () => {
            apiKeyInput.type = apiKeyInput.type === 'password' ? 'text' : 'password';
        });

        // 保存ボタン
        document.getElementById('btn-save-api-key').addEventListener('click', () => {
            const val = apiKeyInput.value.trim();
            if (!val) {
                showToast("APIキーを入力してください。", "error");
                return;
            }
            localStorage.setItem(API_KEY_STORAGE_KEY, val);
            updateApiStatusBadge();
            closeApiModal();
            showToast("Gemini APIキーをブラウザに保存しました。", "success");
        });

        // 削除ボタン
        document.getElementById('btn-delete-api-key').addEventListener('click', () => {
            localStorage.removeItem(API_KEY_STORAGE_KEY);
            apiKeyInput.value = "";
            updateApiStatusBadge();
            showToast("保存されていたAPIキーを削除しました。", "info");
        });

        // ==========================================
        // 1.5. 過去の文字起こし履歴管理（localStorage自動保存＆復元）
        // ==========================================
        const HISTORY_STORAGE_KEY = 'myna_transcript_history_v1';
        const MAX_HISTORY_ITEMS = 20;
        const historyModal = document.getElementById('history-modal');
        const historyListContainer = document.getElementById('history-list-container');
        const historyCountBadge = document.getElementById('history-count-badge');

        function loadHistoryList() {
            try {
                const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.warn('History load failed:', e);
                return [];
            }
        }

        function saveHistoryList(list) {
            try {
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(list));
                updateHistoryBadge();
            } catch (e) {
                console.warn('History save failed:', e);
                showToast("ブラウザの保存容量がいっぱいのため履歴を保存できませんでした", "error");
            }
        }

        function updateHistoryBadge() {
            const list = loadHistoryList();
            if (list.length > 0) {
                historyCountBadge.textContent = list.length;
                historyCountBadge.classList.remove('hidden');
            } else {
                historyCountBadge.classList.add('hidden');
            }
        }

        // 文字起こし完了時や話者置換時に履歴へ保存・更新
        function upsertCurrentTranscriptToHistory() {
            if (!finalTranscriptText) return;
            const list = loadHistoryList();
            const info = getResolvedMeetingTitle();
            const rawDate = document.getElementById('meeting-date').value || `${yyyy}-${mm}-${dd}`;
            const nowStr = new Date().toLocaleString('ja-JP', {
                month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            if (currentHistoryId) {
                const idx = list.findIndex(item => item.id === currentHistoryId);
                if (idx !== -1) {
                    list[idx].title = info.title;
                    list[idx].date = rawDate;
                    list[idx].dateStr = info.dateStr;
                    list[idx].transcript = finalTranscriptText;
                    list[idx].updatedAt = nowStr;
                    saveHistoryList(list);
                    return;
                }
            }

            currentHistoryId = 'hist_' + Date.now();
            list.unshift({
                id: currentHistoryId,
                title: info.title,
                date: rawDate,
                dateStr: info.dateStr,
                transcript: finalTranscriptText,
                updatedAt: nowStr
            });

            if (list.length > MAX_HISTORY_ITEMS) {
                list.length = MAX_HISTORY_ITEMS;
            }
            saveHistoryList(list);
        }

        function renderHistoryModalList() {
            const list = loadHistoryList();
            historyListContainer.innerHTML = '';

            if (list.length === 0) {
                historyListContainer.innerHTML = `
                    <div class="text-center py-10 text-slate-400 text-xs">
                        保存されている文字起こし履歴はまだありません。<br>文字起こしを実行すると自動的にここへ保存されます。
                    </div>
                `;
                return;
            }

            list.forEach((item) => {
                const previewSnippet = item.transcript.replace(/\n+/g, ' ').slice(0, 75) + (item.transcript.length > 75 ? '...' : '');
                const card = document.createElement('div');
                card.className = "flex items-center justify-between gap-3 p-3.5 rounded-xl border border-slate-200 hover:border-myna-amber bg-slate-50 hover:bg-amber-50/40 transition";
                card.innerHTML = `
                    <div class="min-w-0 flex-1 cursor-pointer btn-load-history-item" data-id="${item.id}">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-slate-900 truncate">${escapeHtml(item.title)}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded bg-slate-200 text-slate-700 shrink-0">${escapeHtml(item.dateStr)}</span>
                        </div>
                        <p class="text-[11px] text-slate-500 truncate mt-1">${escapeHtml(previewSnippet)}</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">最終保存: ${escapeHtml(item.updatedAt || '')}</p>
                    </div>
                    <div class="flex items-center space-x-1.5 shrink-0">
                        <button type="button" data-id="${item.id}"
                            class="btn-load-history-item px-3 py-1.5 bg-myna-amber hover:bg-myna-amberHover text-slate-950 font-bold text-xs rounded-lg transition cursor-pointer">
                            開く
                        </button>
                        <button type="button" data-id="${item.id}" title="この履歴を削除"
                            class="btn-delete-history-item p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition cursor-pointer">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                historyListContainer.appendChild(card);
            });

            lucide.createIcons();

            // 「開く」イベント
            historyListContainer.querySelectorAll('.btn-load-history-item').forEach((el) => {
                el.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    restoreHistoryItem(id);
                });
            });

            // 「個別削除」イベント
            historyListContainer.querySelectorAll('.btn-delete-history-item').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = e.currentTarget.getAttribute('data-id');
                    const updated = loadHistoryList().filter(item => item.id !== id);
                    if (currentHistoryId === id) currentHistoryId = null;
                    saveHistoryList(updated);
                    renderHistoryModalList();
                    showToast("選択した履歴を削除しました", "info");
                });
            });
        }

        function restoreHistoryItem(id) {
            const list = loadHistoryList();
            const target = list.find(item => item.id === id);
            if (!target) return;

            currentHistoryId = target.id;
            document.getElementById('meeting-title').value = target.title;
            if (target.date) document.getElementById('meeting-date').value = target.date;

            finalTranscriptText = target.transcript;
            cachedMinutesText = "";
            cachedMinutesSource = "";

            const transcriptOutput = document.getElementById('transcript-output');
            transcriptOutput.textContent = finalTranscriptText;

            buildSpeakerReplacer(finalTranscriptText);
            updateProgressUI(
                'done',
                100,
                `履歴から復元：「${target.title}」`,
                '話者名の一括置換や、Word / Markdown / AI要約議事録の作成がそのまま行えます。'
            );
            setOutputActionsEnabled(true);
            closeHistoryModal();
            document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
            showToast(`「${target.title}」を履歴から復元しました`, "success");
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function closeHistoryModal() {
            historyModal.classList.add('hidden');
        }

        updateHistoryBadge();

        document.getElementById('btn-open-history-modal').addEventListener('click', () => {
            renderHistoryModalList();
            historyModal.classList.remove('hidden');
        });
        document.getElementById('btn-close-history-modal').addEventListener('click', closeHistoryModal);
        document.getElementById('btn-cancel-history-modal').addEventListener('click', closeHistoryModal);
        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) closeHistoryModal();
        });
        document.getElementById('btn-clear-all-history').addEventListener('click', () => {
            localStorage.removeItem(HISTORY_STORAGE_KEY);
            currentHistoryId = null;
            updateHistoryBadge();
            renderHistoryModalList();
            showToast("すべての履歴を削除しました", "info");
        });

        // 初期日付を本日にセット
        const dateInput = document.getElementById('meeting-date');
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;

        // トースト通知関数（alertの代わり）
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                info: 'bg-slate-800 text-white border-slate-700',
                success: 'bg-emerald-700 text-white border-emerald-600',
                error: 'bg-red-600 text-white border-red-500'
            };
            toast.className = `${colors[type]} border px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center space-x-2 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto max-w-sm`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // 会議タイトルの取得（未入力時は日付で自動補完）
        function getResolvedMeetingTitle() {
            const rawTitle = document.getElementById('meeting-title').value.trim();
            const rawDate = document.getElementById('meeting-date').value;
            let formattedDate = `${yyyy}年${mm}月${dd}日`;
            if (rawDate) {
                const parts = rawDate.split('-');
                if (parts.length === 3) {
                    formattedDate = `${parts[0]}年${parts[1]}月${parts[2]}日`;
                }
            }
            if (rawTitle) {
                return {
                    title: rawTitle,
                    dateStr: formattedDate,
                    fileNameBase: `${rawDate || `${yyyy}-${mm}-${dd}`}_${rawTitle.replace(/[\\/:*?"<>|]/g, '_')}`
                };
            } else {
                return {
                    title: `${formattedDate} 会議記録`,
                    dateStr: formattedDate,
                    fileNameBase: `${formattedDate}_会議記録`
                };
            }
        }

        // ==========================================
        // 2. 音声録音 & ビジュアライザー制御
        // ==========================================
        const btnRecordToggle = document.getElementById('btn-record-toggle');
        const btnRecordText = document.getElementById('btn-record-text');
        const recordDot = document.getElementById('record-dot');
        const recordingTimer = document.getElementById('recording-timer');
        const recordingHint = document.getElementById('recording-hint');
        const audioStatusBadge = document.getElementById('audio-status-badge');
        const visualizerCanvas = document.getElementById('visualizer');
        const canvasCtx = visualizerCanvas.getContext('2d');

        // キャンバスのレスポンシブサイズ調整
        function resizeCanvas() {
            const canvas = document.getElementById('visualizer');
            if (!canvas) return;
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            if (!isRecording) drawIdleVisualizer();
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 50);

        function drawIdleVisualizer() {
            const canvas = document.getElementById('visualizer');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isLight = document.body.classList.contains('theme-light');
            ctx.strokeStyle = isLight ? '#CBD5E1' : '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }

        function startVisualizer(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                if (!isRecording) return;
                animationFrameId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);

                canvasCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
                const barWidth = (visualizerCanvas.width / bufferLength) * 2.2;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * visualizerCanvas.height * 0.85;
                    canvasCtx.fillStyle = i % 2 === 0 ? '#F59E0B' : '#FBBF24';
                    const y = (visualizerCanvas.height - barHeight) / 2;
                    canvasCtx.fillRect(x, y, barWidth - 2, Math.max(barHeight, 2));
                    x += barWidth;
                }
            }
            draw();
        }

        function formatSeconds(totalSec) {
            const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const s = String(Math.floor(totalSec % 60)).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // ==========================================
        // 4. 音声の15分自動分割ロジック（Web Audio API -> WAV変換）
        // ==========================================
        function audioBufferToWavBlob(audioBuffer, startSample, endSample) {
            const numChannels = 1; // 音声認識用にモノラル化して軽量・高速化
            const sampleRate = audioBuffer.sampleRate;
            const length = endSample - startSample;
            const buffer = new ArrayBuffer(44 + length * 2);
            const view = new DataView(buffer);

            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, length * 2, true);

            // 全チャンネルをミックスして16bit PCMへ書き込み
            const channels = [];
            for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
                channels.push(audioBuffer.getChannelData(c));
            }

            let offset = 44;
            for (let i = startSample; i < endSample; i++) {
                let sample = 0;
                for (let c = 0; c < channels.length; c++) {
                    sample += channels[c][i];
                }
                sample /= channels.length;
                sample = Math.max(-1, Math.min(1, sample));
                view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                offset += 2;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
