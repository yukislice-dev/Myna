        // Gemini API 共通呼び出しヘルパー（モデル自動フォールバック ＋ 指数バックオフ付き）
        async function fetchGeminiWithFallback(payload) {
            const apiKey = getSavedApiKey();
            // 優先順位順にモデルを自動切り替え（プレビュー版が非対応のキーでも安定版へ自動移行）
            const candidateModels = [
                'gemini-3-flash-preview',
                'gemini-2.5-flash',
                'gemini-2.0-flash'
            ];

            let lastError = null;

            for (const model of candidateModels) {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                const delays = [1000, 2000, 4000, 8000];

                for (let attempt = 0; attempt <= delays.length; attempt++) {
                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            const errMsg = errData.error?.message || `HTTP error! status: ${response.status}`;
                            // 認証・APIキー自体のエラーは即座に通知
                            if (response.status === 400 && errMsg.toLowerCase().includes('api key')) {
                                throw new Error(`APIキーエラー: ${errMsg}`);
                            }
                            if (response.status === 403) {
                                throw new Error(`APIキーエラー: ${errMsg}`);
                            }
                            // 404（モデル未対応）の場合はリトライせず次のモデルへフォールバック
                            if (response.status === 404) {
                                lastError = new Error(errMsg);
                                break;
                            }
                            throw new Error(errMsg);
                        }

                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!text) throw new Error("Empty response from AI");
                        return text.trim();
                    } catch (err) {
                        if (err.message.startsWith('APIキーエラー')) throw err;
                        lastError = err;
                        if (attempt === delays.length) break;
                        await new Promise(res => setTimeout(res, delays[attempt]));
                    }
                }
            }

            throw lastError || new Error('AIとの通信に失敗しました。');
        }

        // Gemini API 文字起こし呼び出し
        async function callGeminiTranscribe(base64Audio, mimeType, chunkIndex, totalChunks, previousSpeakersHint) {
            // 先生のこだわり条件をシステム指示として厳密に設定
            const systemInstruction = `あなたは学校の会議や研修の記録を担当する極めて優秀な書記です。
以下の条件を**必ず**守って、正確に文字起こしを行ってください。

【絶対厳守の条件】
1. AIの勝手な要約や意訳、省略を一切しないこと。話された内容を一言一句忠実に書き起こすこと。
2. 「えっと」「えー」「あのー」「まあ」「そのー」などの意味を持たないフィラー（言い淀み）は綺麗に削除すること。
3. 声質や文脈から「誰が話しているのか」を判別し、「【話者A】」「【話者B】」のように話者ラベルをつけて分類すること。（役職や名前が会話内で呼ばれて判明している場合も、まずは一貫したラベルで統一すること）
4. 読みやすいように、話題の切れ目や発言のまとまりごとに適切な句読点と改行を入れて段落に分けること。
5. 余計な挨拶（「はい、文字起こしを行います」など）や解説は一切出力せず、文字起こし本文のみを出力すること。`;

            let userPrompt = `この音声データ（全${totalChunks}パート中の第${chunkIndex + 1}パート）を、条件に従って正確に文字起こししてください。`;
            if (previousSpeakersHint) {
                userPrompt += `\n※前のパートでは以下の話者ラベルが使われています。同じ人物と思われる場合はラベルを引き継いでください：\n${previousSpeakersHint}`;
            }

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: userPrompt },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64Audio
                                }
                            }
                        ]
                    }
                ],
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                }
            };

            return await fetchGeminiWithFallback(payload);
        }

        // 文字起こし実行ボタンのイベント
        document.getElementById('btn-start-transcribe').addEventListener('click', async () => {
            if (!currentAudioBlob || isTranscribing) return;

            // 外部公開環境でAPIキーが未設定の場合は設定モーダルを開く
            const isPreviewEnv = window.location.protocol === 'blob:' || window.location.hostname.includes('scf.usercontent.goog') || window.location.hostname === 'localhost';
            if (!getSavedApiKey() && !isPreviewEnv) {
                showToast("先に右上の「APIキー設定」からGemini APIキーを登録してください。", "error");
                apiModal.classList.remove('hidden');
                return;
            }

            isTranscribing = true;
            const btnStart = document.getElementById('btn-start-transcribe');
            btnStart.disabled = true;
            btnStart.classList.add('opacity-50', 'cursor-not-allowed');

            // 結果表示枠と進行状況を初期化
            const resultSection = document.getElementById('result-section');
            const transcriptOutput = document.getElementById('transcript-output');
            document.getElementById('speaker-replace-panel').classList.add('hidden');
            setOutputActionsEnabled(false);

            // 前回の議事録キャッシュをリセット
            cachedMinutesText = "";
            cachedMinutesSource = "";

            transcriptOutput.innerHTML = `<span class="theme-text-muted italic">AIが音声を解析して文字起こしを進めています...</span>`;
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

            updateProgressUI(
                'processing',
                5,
                '進行状況：音声データを解析・分割中...',
                '15分ごとのチャンク（塊）に分割しています。長時間の場合は少しお待ちください。'
            );

            try {
                // 音声をデコードして15分（900秒）ごとに分割
                const arrayBuffer = await currentAudioBlob.arrayBuffer();
                const decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await decodeCtx.decodeAudioData(arrayBuffer);
                await decodeCtx.close();

                const CHUNK_DURATION_SEC = 15 * 60; // 15分
                const totalDuration = audioBuffer.duration;
                const totalChunks = Math.max(1, Math.ceil(totalDuration / CHUNK_DURATION_SEC));
                const samplesPerChunk = CHUNK_DURATION_SEC * audioBuffer.sampleRate;

                let transcripts = [];
                let detectedSpeakers = new Set();

                for (let i = 0; i < totalChunks; i++) {
                    const startSample = i * samplesPerChunk;
                    const endSample = Math.min((i + 1) * samplesPerChunk, audioBuffer.length);

                    const currentPercent = Math.round(10 + ((i / totalChunks) * 85));
                    updateProgressUI(
                        'processing',
                        currentPercent,
                        `進行状況：AIが文字起こし中（パート ${i + 1} / ${totalChunks}）`,
                        `第${i + 1}パート（${formatSeconds(i * CHUNK_DURATION_SEC)} 〜 ${formatSeconds(Math.min((i + 1) * CHUNK_DURATION_SEC, totalDuration))}）を処理しています...`
                    );

                    const wavBlob = audioBufferToWavBlob(audioBuffer, startSample, endSample);
                    const base64Audio = await blobToBase64(wavBlob);

                    const speakerHint = detectedSpeakers.size > 0
                        ? Array.from(detectedSpeakers).join(', ')
                        : '';

                    const chunkText = await callGeminiTranscribe(
                        base64Audio,
                        'audio/wav',
                        i,
                        totalChunks,
                        speakerHint
                    );

                    transcripts.push(chunkText);

                    // 途中経過をリアルタイムにテキスト枠へ反映
                    transcriptOutput.textContent = transcripts.join('\n\n');
                    transcriptOutput.scrollTop = transcriptOutput.scrollHeight;

                    // 話者ラベルの抽出（引き継ぎ用）
                    const matches = chunkText.match(/【[^】]+】/g);
                    if (matches) {
                        matches.forEach(m => detectedSpeakers.add(m));
                    }
                }

                // 全パート結合
                finalTranscriptText = transcripts.join('\n\n');
                transcriptOutput.textContent = finalTranscriptText;

                // 新規履歴として自動保存
                currentHistoryId = null;
                upsertCurrentTranscriptToHistory();

                // 話者一括置換UIの生成
                buildSpeakerReplacer(finalTranscriptText);

                updateProgressUI(
                    'done',
                    100,
                    `進行状況：完了！（全${totalChunks}パートの文字起こしが終了しました）`,
                    '必要に応じて話者名を先生のお名前に一括置換し、下のボタンから議事録ファイルを作成できます。'
                );
                setOutputActionsEnabled(true);
                showToast("文字起こしが完了しました！（履歴にも自動保存されました）", "success");

            } catch (err) {
                console.error("Transcription Error:", err);
                const isKeyErr = err.message && err.message.startsWith('APIキーエラー');
                updateProgressUI(
                    'error',
                    0,
                    isKeyErr ? '進行状況：APIキーを確認してください' : '進行状況：エラーが発生しました',
                    isKeyErr
                        ? '右上の「APIキー設定」から正しいGemini APIキーが入力されているかご確認ください。'
                        : '音声の解析またはAIとの通信中にエラーが発生しました。ネットワーク環境やAPIキーをご確認の上、もう一度お試しください。'
                );
                showToast(isKeyErr ? "APIキーエラーが発生しました。設定をご確認ください。" : "文字起こし中にエラーが発生しました。", "error");
            } finally {
                isTranscribing = false;
                btnStart.disabled = false;
                btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        // ==========================================
        // 6. 話者名の一括置換機能
        // ==========================================
        function buildSpeakerReplacer(text, preservedInputs = {}) {
            const panel = document.getElementById('speaker-replace-panel');
            const list = document.getElementById('speaker-replace-list');
            list.innerHTML = '';

            // 【話者A】のようなラベルを重複なく抽出
            const matches = text.match(/【[^】]+】/g);
            if (!matches) {
                panel.classList.add('hidden');
                return;
            }

            const uniqueSpeakers = [...new Set(matches)];
            if (uniqueSpeakers.length === 0) {
                panel.classList.add('hidden');
                return;
            }

            uniqueSpeakers.forEach((speakerLabel) => {
                const cleanName = speakerLabel.replace(/[【】]/g, '');
                const savedDraft = preservedInputs[speakerLabel] || '';
                const itemDiv = document.createElement('div');
                itemDiv.className = "theme-input flex items-center space-x-1.5 p-2 rounded-xl";
                itemDiv.innerHTML = `
                    <span class="text-xs font-bold text-myna-amber shrink-0 px-1.5">${escapeHtml(cleanName)}</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5 theme-text-muted shrink-0"></i>
                    <input type="text" placeholder="例：〇〇先生" data-original="${escapeHtml(speakerLabel)}" value="${escapeHtml(savedDraft)}"
                        class="speaker-input flex-1 min-w-0 text-xs px-2.5 py-1.5 bg-transparent border border-slate-500/30 rounded-lg focus:outline-none focus:border-myna-amber">
                    <button type="button" class="btn-apply-speaker px-2.5 py-1.5 bg-myna-amber hover:bg-myna-amberHover text-slate-950 font-bold text-xs rounded-lg shrink-0 transition cursor-pointer">
                        置換
                    </button>
                `;
                list.appendChild(itemDiv);
            });

            lucide.createIcons();
            panel.classList.remove('hidden');

            // 置換ボタンのイベント登録
            list.querySelectorAll('.btn-apply-speaker').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    const container = e.target.closest('div');
                    const input = container.querySelector('.speaker-input');
                    const originalLabel = input.getAttribute('data-original');
                    const newName = input.value.trim();

                    if (!newName) {
                        showToast("新しい名前を入力してください", "info");
                        return;
                    }

                    // 他の話者ボックスに入力途中だった内容をすべて退避・保持する
                    const preservedInputs = {};
                    list.querySelectorAll('.speaker-input').forEach((otherInput) => {
                        const key = otherInput.getAttribute('data-original');
                        if (key !== originalLabel && otherInput.value.trim() !== '') {
                            preservedInputs[key] = otherInput.value;
                        }
                    });

                    const newLabel = `【${newName.replace(/[【】]/g, '')}】`;
                    finalTranscriptText = finalTranscriptText.split(originalLabel).join(newLabel);
                    document.getElementById('transcript-output').textContent = finalTranscriptText;

                    // 話者名が変わったので議事録キャッシュをリセットし、履歴データも更新
                    cachedMinutesText = "";
                    cachedMinutesSource = "";
                    upsertCurrentTranscriptToHistory();

                    showToast(`「${originalLabel}」を「${newLabel}」に一括置換しました`, "success");
                    buildSpeakerReplacer(finalTranscriptText, preservedInputs);
                });
            });
        }

        // 全文コピー機能（iFrame制限対応のため execCommand('copy') を使用）
        document.getElementById('btn-copy-text').addEventListener('click', () => {
            if (!finalTranscriptText) return;
            const textarea = document.createElement('textarea');
            textarea.value = finalTranscriptText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("文字起こし全文をクリップボードにコピーしました", "success");
            } catch (err) {
                showToast("コピーに失敗しました", "error");
            }
            document.body.removeChild(textarea);
        });

        // ==========================================
        // 7. Word (.docx) および Markdown (.md) ファイル出力機能
        // ==========================================
        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // Markdown (.md) ダウンロード（文字起こし全文）
        document.getElementById('btn-download-md').addEventListener('click', () => {
            if (!finalTranscriptText) return;
            const info = getResolvedMeetingTitle();

            const mdContent = `# ${info.title}\n\n- **実施日:** ${info.dateStr}\n- **作成ツール:** Myna（音声文字起こし）\n\n---\n\n${finalTranscriptText}\n`;

            const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
            triggerDownload(blob, `${info.fileNameBase}.md`);
            showToast(`「${info.fileNameBase}.md」を保存しました`, "success");
        });

        // Word (.docx) ダウンロード（文字起こし全文）
        document.getElementById('btn-download-word').addEventListener('click', async () => {
            if (!finalTranscriptText) return;
            const info = getResolvedMeetingTitle();

            try {
                const { Document, Packer, Paragraph, TextRun, HeadingLevel, BorderStyle } = window.docx;

                const lines = finalTranscriptText.split('\n');
                const bodyParagraphs = [];

                lines.forEach((line) => {
                    const trimmed = line.trim();
                    if (!trimmed) {
                        bodyParagraphs.push(new Paragraph({ text: "", spacing: { after: 120 } }));
                        return;
                    }

                    // 【話者A】が含まれる行は話者名を太字にして見やすく整形
                    const speakerMatch = trimmed.match(/^(【[^】]+】)(.*)$/);
                    if (speakerMatch) {
                        bodyParagraphs.push(
                            new Paragraph({
                                children: [
                                    new TextRun({
                                        text: speakerMatch[1],
                                        bold: true,
                                        color: "1E293B",
                                        size: 22,
                                        font: "游ゴシック"
                                    }),
                                    new TextRun({
                                        text: speakerMatch[2],
                                        size: 22,
                                        font: "游ゴシック"
                                    })
                                ],
                                spacing: { after: 160, line: 340 }
                            })
                        );
                    } else {
                        bodyParagraphs.push(
                            new Paragraph({
                                children: [
                                    new TextRun({
                                        text: trimmed,
                                        size: 22,
                                        font: "游ゴシック"
                                    })
                                ],
                                spacing: { after: 160, line: 340 }
                            })
                        );
                    }
                });

                const doc = new Document({
                    sections: [{
                        properties: {},
                        children: [
                            new Paragraph({
                                text: info.title,
                                heading: HeadingLevel.HEADING_1,
                                spacing: { after: 120 }
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({
                                        text: `実施日: ${info.dateStr}`,
                                        color: "64748B",
                                        size: 20,
                                        font: "游ゴシック"
                                    })
                                ],
                                border: {
                                    bottom: {
                                        color: "CBD5E1",
                                        space: 6,
                                        style: BorderStyle.SINGLE,
                                        size: 6
                                    }
                                },
                                spacing: { after: 300 }
                            }),
                            ...bodyParagraphs
                        ]
                    }]
                });

                const blob = await Packer.toBlob(doc);
                triggerDownload(blob, `${info.fileNameBase}.docx`);
                showToast(`「${info.fileNameBase}.docx」を保存しました`, "success");
            } catch (err) {
                console.error("Word generation error:", err);
                showToast("Wordファイルの生成中にエラーが発生しました", "error");
            }
        });

        // ==========================================
        // 8. AI要約・議事録ファイルの作成＆直接ダウンロード機能
        // ==========================================
        async function callGeminiSummarizeMinutes(transcript) {
            const systemInstruction = `あなたは学校の職員会議や校内研修・講演の記録をまとめる熟練の書記です。
提供された「文字起こしテキスト」をもとに、先生方が後から読み返して一目で内容や学び、決定事項を把握できる、綺麗に整理された「記録・まとめ文書」を作成してください。

【出力フォーマット（Markdown形式）】
## 1. 概要・テーマ
（今回の会議や研修の全体テーマ・目的を2〜3行で簡潔にまとめる）

## 2. 主な内容・ポイント（トピック別整理）
（話された流れに沿って話題や講義の章立てごとに小見出し「### 」や箇条書き「- 」を使い、誰がどのような発言・解説をしたかが分かるように整理する）

## 3. 決定事項・今後の対応
（※会議などで合意・決定したことや今後のアクションが話し合われていた場合のみ、この項目を作成して箇条書きでまとめる。研修や講演など決定事項がない内容の場合は、このセクション自体を出力せず省略すること）

## 4. まとめ・重要キーワード
（研修での重要な学びや、会議全体の結論・ポイントを簡潔に締めくくる）

【作成時のルール】
- 事実に基づき、推測や勝手な創作を交えないこと。
- 余計な挨拶（「要約を作成しました」など）は一切書かず、本文のみを出力すること。`;

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: `以下の文字起こしテキストを、内容（会議か研修か）に合わせて綺麗に整理・要約してください。\n\n---\n${transcript}` }
                        ]
                    }
                ],
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                }
            };

            return await fetchGeminiWithFallback(payload);
        }

        async function getOrGenerateMinutesText() {
            // すでに同じ文字起こし内容から生成済みの場合はキャッシュを即座に返す
            if (cachedMinutesText && cachedMinutesSource === finalTranscriptText) {
                return cachedMinutesText;
            }
            const generated = await callGeminiSummarizeMinutes(finalTranscriptText);
            cachedMinutesText = generated;
            cachedMinutesSource = finalTranscriptText;
            return generated;
        }

        function setMinutesButtonsBusy(busy, targetType) {
            isGeneratingMinutes = busy;
            const btnWord = document.getElementById('btn-create-minutes-word');
            const btnMd = document.getElementById('btn-create-minutes-md');
            const labelWord = document.getElementById('label-minutes-word');
            const labelMd = document.getElementById('label-minutes-md');
            const badge = document.getElementById('minutes-status-badge');

            btnWord.disabled = busy;
            btnMd.disabled = busy;

            if (busy) {
                badge.textContent = "AIが要約・整理中...";
                badge.className = "text-xs font-bold px-3 py-1 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30";
                if (targetType === 'word') {
                    labelWord.textContent = "AIが要約・議事録を作成中...";
                } else {
                    labelMd.textContent = "AIが要約・議事録を作成中...";
                }
            } else {
                badge.textContent = "作成完了・保存済";
                badge.className = "text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                labelWord.textContent = "要約・議事録を Word (.docx) で作成・保存";
                labelMd.textContent = "要約・議事録を Markdown (.md) で作成・保存";
            }
        }

        // 議事録 Markdown (.md) 作成・保存
        document.getElementById('btn-create-minutes-md').addEventListener('click', async () => {
            if (!finalTranscriptText || isGeneratingMinutes) return;

            setMinutesButtonsBusy(true, 'md');
            showToast("AIが文字起こしから要約・議事録を作成しています...", "info");

            try {
                const minutesText = await getOrGenerateMinutesText();
                const info = getResolvedMeetingTitle();
                const mdContent = `# ${info.title}（要約・記録）\n\n- **実施日:** ${info.dateStr}\n- **作成ツール:** Myna（AI要約・議事録）\n\n---\n\n${minutesText}\n`;

                const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
                triggerDownload(blob, `${info.fileNameBase}_議事録.md`);
                showToast(`「${info.fileNameBase}_議事録.md」を作成・保存しました！`, "success");
            } catch (err) {
                console.error("Minutes MD error:", err);
                showToast("要約・議事録の作成中にエラーが発生しました。", "error");
            } finally {
                setMinutesButtonsBusy(false, 'md');
            }
        });

        // 議事録 Word (.docx) 作成・保存
        document.getElementById('btn-create-minutes-word').addEventListener('click', async () => {
            if (!finalTranscriptText || isGeneratingMinutes) return;

            setMinutesButtonsBusy(true, 'word');
            showToast("AIが文字起こしから要約・議事録を作成しています...", "info");

            try {
                const minutesText = await getOrGenerateMinutesText();
                const info = getResolvedMeetingTitle();
                const { Document, Packer, Paragraph, TextRun, HeadingLevel, BorderStyle } = window.docx;

                const lines = minutesText.split('\n');
                const bodyParagraphs = [];

                lines.forEach((line) => {
                    const trimmed = line.trim();
                    if (!trimmed) {
                        bodyParagraphs.push(new Paragraph({ text: "", spacing: { after: 100 } }));
                        return;
                    }

                    // Markdown見出し（## / ###）と箇条書き（- / *）をWordの適切な書式に変換
                    if (trimmed.startsWith('## ')) {
                        bodyParagraphs.push(
                            new Paragraph({
                                text: trimmed.replace(/^##\s+/, ''),
                                heading: HeadingLevel.HEADING_2,
                                spacing: { before: 240, after: 120 }
                            })
                        );
                    } else if (trimmed.startsWith('### ')) {
                        bodyParagraphs.push(
                            new Paragraph({
                                text: trimmed.replace(/^###\s+/, ''),
                                heading: HeadingLevel.HEADING_3,
                                spacing: { before: 180, after: 80 }
                            })
                        );
                    } else if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                        const bulletText = trimmed.replace(/^[-*]\s+/, '').replace(/\*\*/g, '');
                        bodyParagraphs.push(
                            new Paragraph({
                                children: [
                                    new TextRun({
                                        text: bulletText,
                                        size: 22,
                                        font: "游ゴシック"
                                    })
                                ],
                                bullet: { level: 0 },
                                spacing: { after: 100, line: 320 }
                            })
                        );
                    } else {
                        const cleanText = trimmed.replace(/\*\*/g, '');
                        bodyParagraphs.push(
                            new Paragraph({
                                children: [
                                    new TextRun({
                                        text: cleanText,
                                        size: 22,
                                        font: "游ゴシック"
                                    })
                                ],
                                spacing: { after: 140, line: 340 }
                            })
                        );
                    }
                });

                const doc = new Document({
                    sections: [{
                        properties: {},
                        children: [
                            new Paragraph({
                                text: `${info.title}（要約・記録）`,
                                heading: HeadingLevel.HEADING_1,
                                spacing: { after: 120 }
                            }),
                            new Paragraph({
                                children: [
                                    new TextRun({
                                        text: `実施日: ${info.dateStr}`,
                                        color: "64748B",
                                        size: 20,
                                        font: "游ゴシック"
                                    })
                                ],
                                border: {
                                    bottom: {
                                        color: "CBD5E1",
                                        space: 6,
                                        style: BorderStyle.SINGLE,
                                        size: 6
                                    }
                                },
                                spacing: { after: 280 }
                            }),
                            ...bodyParagraphs
                        ]
                    }]
                });

                const blob = await Packer.toBlob(doc);
                triggerDownload(blob, `${info.fileNameBase}_議事録.docx`);
                showToast(`「${info.fileNameBase}_議事録.docx」を作成・保存しました！`, "success");
            } catch (err) {
                console.error("Minutes Word error:", err);
                showToast("要約・議事録のWord生成中にエラーが発生しました。", "error");
            } finally {
                setMinutesButtonsBusy(false, 'word');
            }
        });
    </script>
</body>
